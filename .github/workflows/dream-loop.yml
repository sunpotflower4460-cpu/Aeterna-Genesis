name: Genesis Dream Loop

on:
  # Run once when Dream implementation/workflow changes land on main.
  # Generated evidence never touches these paths, so Dream commits cannot recursively retrigger it.
  push:
    branches: [main]
    paths:
      - '.github/workflows/dream-loop.yml'
      - 'ai_lab/dream/**'
  schedule:
    # Four connected research cycles per JST day: 03:17 / 09:17 / 15:17 / 21:17.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-dream-loop
  cancel-in-progress: false

jobs:
  research-burst:
    runs-on: ubuntu-latest
    # Must finish before the next six-hour cycle; this is a bounded burst, never an endless daemon.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research dependencies
        run: pip install -r requirements.txt

      - name: Restore Dream state
        uses: actions/cache/restore@v4
        with:
          path: |
            runtime/dream
            ai_lab/discoveries/ledger.json
            ai_lab/discoveries/event_ledger.json
            ai_lab/discoveries/view_presets.json
            ai_lab/discoveries/coverage_atlas.json
            ai_lab/discoveries/hypothesis_ledger.json
            ai_lab/discoveries/research_decisions.json
            ai_lab/discoveries/native3d_discoveries.json
            rooms/candidates
            rooms/rejected_in_3d
            rooms/jobs
          key: dream-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dream-state-${{ runner.os }}-

      - name: Run Adaptive Dream Cycle v2
        run: |
          python -m ai_lab.dream.adaptive_loop \
            --quick \
            --trials 2048 \
            --native3d-trials 100 \
            --workers 4 \
            --repro-top 8 \
            --repro-seeds 3 \
            --compare-native3d-top 12 \
            --native-variants 1 \
            --max-jobs 12

      - name: Save Dream state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            runtime/dream
            ai_lab/discoveries/ledger.json
            ai_lab/discoveries/event_ledger.json
            ai_lab/discoveries/view_presets.json
            ai_lab/discoveries/coverage_atlas.json
            ai_lab/discoveries/hypothesis_ledger.json
            ai_lab/discoveries/research_decisions.json
            ai_lab/discoveries/native3d_discoveries.json
            rooms/candidates
            rooms/rejected_in_3d
            rooms/jobs
          key: dream-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Night Report and discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-night-report-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ai_lab/reports/nightly/latest.json
            ai_lab/reports/nightly/*/report.md
            ai_lab/reports/nightly/*/summary.json
            ai_lab/reports/nightly/*/events.json
            ai_lab/discoveries/ledger.json
            ai_lab/discoveries/event_ledger.json
            ai_lab/discoveries/view_presets.json
            ai_lab/discoveries/coverage_atlas.json
            ai_lab/discoveries/hypothesis_ledger.json
            ai_lab/discoveries/research_decisions.json
            ai_lab/discoveries/native3d_discoveries.json
            rooms/candidates
            rooms/rejected_in_3d
            rooms/jobs
            app/generated/catalog.json
            app/public/data/dream

      # Persist compact knowledge plus genuinely useful candidate evidence. Mass failures are NOT files;
      # they are aggregated into coverage_atlas.json. Set PERSIST_DREAM_RESULTS=false for artifact/cache-only mode.
      - name: Persist generated evidence to repository
        if: ${{ vars.PERSIST_DREAM_RESULTS != 'false' }}
        shell: bash
        run: |
          git config user.name "aeterna-dream-bot"
          git config user.email "aeterna-dream-bot@users.noreply.github.com"
          git add \
            ai_lab/discoveries/ledger.json \
            ai_lab/discoveries/event_ledger.json \
            ai_lab/discoveries/view_presets.json \
            ai_lab/discoveries/coverage_atlas.json \
            ai_lab/discoveries/hypothesis_ledger.json \
            ai_lab/discoveries/research_decisions.json \
            ai_lab/discoveries/native3d_discoveries.json \
            ai_lab/reports/nightly \
            rooms/candidates rooms/rejected_in_3d rooms/jobs \
            app/generated/catalog.json app/public/data || true
          if git diff --cached --quiet; then
            echo "No generated Dream evidence changed."
          else
            git commit -m "record Adaptive Dream evidence"
            git push
          fi
