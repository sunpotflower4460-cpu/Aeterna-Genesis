name: Genesis Dream Loop

on:
  # Run once when research implementation/workflow changes land on main.
  # Generated evidence never touches these code paths, so evidence commits do not recurse.
  push:
    branches: [main]
    paths:
      - '.github/workflows/dream-loop.yml'
      - 'ai_lab/dream/**'
      - 'ai_lab/missions/**'
      - 'genesis/worlds/**'
      - 'genesis/models/vector_o3.py'
      - 'genesis/models/q_tensor_nematic.py'
      - 'genesis/diagnostics/**'
  schedule:
    # Primary evidence burst every hour at :17.
    - cron: '17 * * * *'
    # Safety-net check at :47. It only runs a burst when the latest completed report is >70 min old.
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-dream-loop
  cancel-in-progress: false

jobs:
  research-burst:
    runs-on: ubuntu-latest
    # A real research burst must stay bounded and finish before the next one.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to rebase generated evidence onto a feature commit, without
          # cloning an ever-growing evidence history every hour.
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Decide whether backup burst is needed
        id: watchdog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_EXPR" == "47 * * * *" ]]; then
            RUN_BURST="$(python -m ai_lab.dream.watchdog --latest ai_lab/reports/easy/latest.json --max-age-minutes 70)"
          else
            RUN_BURST="true"
            echo "Dream watchdog: primary/push/manual event, run normally." >&2
          fi
          echo "run_burst=$RUN_BURST" >> "$GITHUB_OUTPUT"
          echo "run_burst=$RUN_BURST"

      - name: Backup not needed
        if: steps.watchdog.outputs.run_burst != 'true'
        run: echo "A recent completed Dream report exists; the :47 safety-net exits without duplicating research."

      - name: Install research dependencies
        if: steps.watchdog.outputs.run_burst == 'true'
        run: pip install -r requirements.txt

      - name: Restore Dream state
        if: steps.watchdog.outputs.run_burst == 'true'
        uses: actions/cache/restore@v4
        with:
          # Only untracked runtime artifacts belong in the cache. Tracked ledgers, reports and rooms
          # arrive with the checkout; restoring an older cached copy over them would silently roll back
          # committed evidence and then re-commit the rollback.
          path: runtime/dream
          key: dream-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dream-state-${{ runner.os }}-

      - name: Run hourly Adaptive Dream v8 Pure Genesis R0 + NØ research
        if: steps.watchdog.outputs.run_burst == 'true'
        # Leave headroom inside the 50-minute job so state save, artifacts and the evidence commit
        # still run when a burst overruns, instead of being killed with it.
        timeout-minutes: 38
        run: |
          python -m ai_lab.dream.strict_goal_loop \
            --quick \
            --trials 2048 \
            --native3d-trials 100 \
            --workers 4 \
            --repro-top 8 \
            --repro-seeds 3 \
            --compare-native3d-top 12 \
            --geometry-top 16 \
            --geometry-broad 32 \
            --followup-trials-2d 256 \
            --followup-trials-3d 32 \
            --followup-max-leads 4 \
            --fission-path-trials-2d 24 \
            --fission-path-max-leads 2 \
            --deep-time-max-leads 1 \
            --open-ended-probes 24 \
            --open-ended-max-episodes 3 \
            --unknown-followup-max-patterns 2 \
            --max-synthesized-hypotheses 3 \
            --root-law-trials 24 \
            --root-sizes 8,12,16 \
            --root-steps 48 \
            --frontier-experiments 24 \
            --native-variants 1 \
            --max-jobs 12

      # Shadow-only: heterogeneous Worlds are observed in a common envelope but cannot change the
      # g001 search budget, official Levels, promotion gates or hypothesis confidence. The same step
      # also projects recurrent g001 X-patterns into a common observable vocabulary and compares them
      # with independently evolved trajectories in the other Worlds.
      - name: Run Multi-World Genesis shadow observer
        if: steps.watchdog.outputs.run_burst == 'true'
        run: |
          python -m ai_lab.dream.multiworld \
            --quick \
            --seed "${{ github.run_number }}" \
            --output ai_lab/reports/multiworld/latest.json

      # Replace any old alias *before* expensive independent replication starts. If the next step is
      # killed by timeout/startup failure, the current-burst NOT_COMPLETED marker remains rather than
      # publishing a previous burst's replication report as fresh evidence.
      - name: Prime current Cross-World replication evidence
        if: steps.watchdog.outputs.run_burst == 'true'
        run: |
          python -m ai_lab.dream.crossworld_replication \
            --base-seed "${{ github.run_number }}" \
            --prime-only

      # Fresh-seed replication runs only when the primary comparator found a current lead. It is a
      # separate shadow and never increments the cumulative CWX ledger. Per-attempt compute errors are
      # reported but do not become physical misses; continue-on-error keeps the main research burst alive.
      - name: Independently replicate current Cross-World leads
        if: steps.watchdog.outputs.run_burst == 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -m ai_lab.dream.crossworld_replication \
            --quick \
            --base-seed "${{ github.run_number }}" \
            --replicates 3 \
            --max-matches 2

      # Human-first orientation is generated only after scientific/shadow evidence, including the
      # current-burst replication status, exists. It never changes gates or deletes failures;
      # research_memory.json keeps compact lessons so weak/saturated questions are not forgotten.
      - name: Build Research Compass and no-repeat memory
        if: steps.watchdog.outputs.run_burst == 'true'
        run: python -m ai_lab.dream.research_compass

      - name: Save Dream state
        if: ${{ always() && steps.watchdog.outputs.run_burst == 'true' }}
        uses: actions/cache/save@v4
        with:
          # Only untracked runtime artifacts belong in the cache. Tracked ledgers, reports and rooms
          # arrive with the checkout; restoring an older cached copy over them would silently roll back
          # committed evidence and then re-commit the rollback.
          path: runtime/dream
          key: dream-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload reports and discovery evidence
        if: ${{ always() && steps.watchdog.outputs.run_burst == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: genesis-research-report-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            CURRENT_RESEARCH.md
            ai_lab/reports/nightly/latest.json
            ai_lab/reports/nightly/*/report.md
            ai_lab/reports/nightly/*/summary.json
            ai_lab/reports/nightly/*/events.json
            ai_lab/reports/easy/latest.json
            ai_lab/reports/easy/latest.md
            ai_lab/reports/easy/environment_latest.json
            ai_lab/reports/easy/research_compass_latest.json
            ai_lab/reports/easy/research_compass_latest.md
            ai_lab/reports/easy/root_latest.json
            ai_lab/reports/easy/frontier_latest.json
            ai_lab/reports/easy/nothing_latest.json
            ai_lab/reports/easy/nothing_latest.md
            ai_lab/reports/easy/nothing_latest.png
            ai_lab/reports/easy/nothing/**
            ai_lab/reports/easy/*/report.json
            ai_lab/reports/easy/*/report.md
            ai_lab/reports/multiworld/latest.json
            ai_lab/reports/emergence/latest.json
            ai_lab/reports/crossworld/latest.json
            ai_lab/reports/crossworld/replication_latest.json
            ai_lab/discoveries/research_memory.json
            ai_lab/discoveries/ledger.json
            ai_lab/discoveries/event_ledger.json
            ai_lab/discoveries/view_presets.json
            ai_lab/discoveries/coverage_atlas.json
            ai_lab/discoveries/hypothesis_ledger.json
            ai_lab/discoveries/research_decisions.json
            ai_lab/discoveries/native3d_discoveries.json
            ai_lab/discoveries/promising_leads.json
            ai_lab/discoveries/fission_path_leads.json
            ai_lab/discoveries/deep_time_fission.json
            ai_lab/discoveries/emergence_graph.json
            ai_lab/discoveries/cross_world_emergence.json
            ai_lab/discoveries/question_critic.json
            ai_lab/discoveries/unknown_followups.json
            ai_lab/discoveries/hypothesis_graph.json
            ai_lab/discoveries/hypothesis_history.json
            ai_lab/discoveries/hypothesis_portfolio.json
            ai_lab/discoveries/goal_progress.json
            ai_lab/discoveries/frontier_expansion.json
            ai_lab/missions/zero_to_division_like.json
            ai_lab/missions/pure_genesis_r0.json
            rooms/candidates
            rooms/rejected_in_3d
            rooms/jobs
            app/generated/catalog.json
            app/public/data/dream

      # Persist compact knowledge plus useful candidate evidence. Mundane failures are represented by
      # Coverage Atlas / research_memory, not one human-facing file per failed trial. Raw source ledgers
      # remain complete. Easy reports are intentionally kept for human reading.
      - name: Persist generated evidence to repository
        if: ${{ vars.PERSIST_DREAM_RESULTS != 'false' && steps.watchdog.outputs.run_burst == 'true' }}
        shell: bash
        run: |
          git config user.name "aeterna-dream-bot"
          git config user.email "aeterna-dream-bot@users.noreply.github.com"
          git add \
            CURRENT_RESEARCH.md \
            ai_lab/discoveries/dream_state.json \
            ai_lab/discoveries/research_memory.json \
            ai_lab/discoveries/ledger.json \
            ai_lab/discoveries/event_ledger.json \
            ai_lab/discoveries/view_presets.json \
            ai_lab/discoveries/coverage_atlas.json \
            ai_lab/discoveries/hypothesis_ledger.json \
            ai_lab/discoveries/research_decisions.json \
            ai_lab/discoveries/native3d_discoveries.json \
            ai_lab/discoveries/promising_leads.json \
            ai_lab/discoveries/fission_path_leads.json \
            ai_lab/discoveries/deep_time_fission.json \
            ai_lab/discoveries/emergence_graph.json \
            ai_lab/discoveries/cross_world_emergence.json \
            ai_lab/discoveries/question_critic.json \
            ai_lab/discoveries/unknown_followups.json \
            ai_lab/discoveries/hypothesis_graph.json \
            ai_lab/discoveries/hypothesis_history.json \
            ai_lab/discoveries/hypothesis_portfolio.json \
            ai_lab/discoveries/goal_progress.json \
            ai_lab/discoveries/frontier_expansion.json \
            ai_lab/reports/nightly \
            ai_lab/reports/easy \
            ai_lab/reports/multiworld \
            ai_lab/reports/emergence \
            ai_lab/reports/crossworld \
            rooms/candidates rooms/rejected_in_3d rooms/jobs \
            app/generated/catalog.json app/public/data || true
          if git diff --cached --quiet; then
            echo "No generated Dream evidence changed."
            exit 0
          fi
          git commit -m "record hourly Adaptive Dream evidence"
          # A feature commit can land while a 30-50 minute burst is running. Rebase the generated
          # evidence on top of it rather than discarding an entire burst to a rejected push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Dream evidence pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git fetch --depth=50 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Dream evidence conflicts with a human commit on main; not overwriting it."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push Dream evidence after 3 attempts."
          exit 1
