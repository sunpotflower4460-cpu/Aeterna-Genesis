name: Science Bridge

on:
  # Two literature-refresh + experiment windows per day. They share the Dream concurrency group so
  # generated evidence/continuity cannot race the strict or Free Hypothesis writers.
  schedule:
    - cron: '53 1,13 * * *'
  push:
    branches: [main]
    paths:
      - 'ai_lab/dream/science_bridge.py'
      - 'ai_lab/dream/science_bridge_runner.py'
      - 'ai_lab/dream/research_continuity.py'
      - 'ai_lab/discoveries/science_bridge_sources.json'
      - '.github/workflows/science-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-dream-loop
  cancel-in-progress: false

jobs:
  science-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull established science and discover new reading candidates
        timeout-minutes: 6
        run: |
          python -m ai_lab.dream.science_bridge \
            --online \
            --max-live-results 12

      - name: Run curated literature-inspired experiments in Free Lab only
        timeout-minutes: 24
        run: |
          python -m ai_lab.dream.science_bridge_runner \
            --quick \
            --replicates 3 \
            --seed "${{ github.run_number }}"

      - name: Carry literature and experiment lessons into durable handoff
        run: python -m ai_lab.dream.research_continuity

      - name: Upload Science Bridge evidence and context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-bridge-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ai_lab/reports/easy/science_bridge_latest.json
            ai_lab/reports/easy/science_bridge_latest.md
            ai_lab/discoveries/science_bridge_directions.json
            ai_lab/discoveries/science_bridge_ledger.json
            ai_lab/reports/easy/free_hypothesis_latest.json
            ai_lab/reports/easy/free_hypothesis_latest.md
            ai_lab/discoveries/free_hypothesis_lab.json
            ai_lab/discoveries/research_continuity.json
            ai_lab/reports/easy/research_continuity_latest.md

      - name: Persist literature bridge without touching strict scientific ledgers
        shell: bash
        run: |
          git config user.name "aeterna-science-bridge-bot"
          git config user.email "aeterna-science-bridge-bot@users.noreply.github.com"
          git add -- \
            ai_lab/reports/easy/science_bridge_latest.json \
            ai_lab/reports/easy/science_bridge_latest.md \
            ai_lab/discoveries/science_bridge_directions.json \
            ai_lab/discoveries/science_bridge_ledger.json \
            ai_lab/reports/easy/free_hypothesis_latest.json \
            ai_lab/reports/easy/free_hypothesis_latest.md \
            ai_lab/discoveries/free_hypothesis_lab.json \
            ai_lab/discoveries/research_continuity.json \
            ai_lab/reports/easy/research_continuity_latest.md
          if git diff --cached --quiet; then
            echo "No Science Bridge evidence/context changed."
            exit 0
          fi
          git commit -m "record separated Science Bridge evidence and continuity"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Science Bridge evidence pushed on attempt $attempt."
              exit 0
            fi
            git fetch --depth=50 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Science Bridge conflicts with newer research; refusing to overwrite it."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          exit 1
