name: Science Bridge

# ⏸ PAUSED 2026-09 (research restart, plan phase P0): automatic triggers removed.
# Only manual `workflow_dispatch` remains. The original push/schedule/workflow_run triggers are
# preserved in git history (freeze point: tag evidence-freeze-2026-09 / docs/INVENTORY_2026-09.md).
# Do not re-enable without the human owner's decision; the restart plan replaces these with one
# small daily digest that never writes to main.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-dream-loop
  cancel-in-progress: false

jobs:
  science-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull established science and discover new reading candidates
        timeout-minutes: 6
        run: |
          python -m ai_lab.dream.science_bridge \
            --online \
            --max-live-results 12

      - name: Run curated literature-inspired experiments in Free Lab only
        timeout-minutes: 24
        run: |
          python -m ai_lab.dream.science_bridge_runner \
            --quick \
            --replicates 3 \
            --seed "${{ github.run_number }}"

      - name: Upload Science Bridge evidence and context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-bridge-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ai_lab/reports/easy/science_bridge_latest.json
            ai_lab/reports/easy/science_bridge_latest.md
            ai_lab/discoveries/science_bridge_directions.json
            ai_lab/discoveries/science_bridge_ledger.json
            ai_lab/reports/easy/science_bridge_experiment_latest.json
            ai_lab/discoveries/science_bridge_experiment_ledger.json
            ai_lab/reports/easy/free_hypothesis_latest.json
            ai_lab/reports/easy/free_hypothesis_latest.md
            ai_lab/discoveries/free_hypothesis_lab.json

      - name: Persist literature bridge without touching strict scientific ledgers
        shell: bash
        run: |
          git config user.name "aeterna-science-bridge-bot"
          git config user.email "aeterna-science-bridge-bot@users.noreply.github.com"
          git add -- \
            ai_lab/reports/easy/science_bridge_latest.json \
            ai_lab/reports/easy/science_bridge_latest.md \
            ai_lab/discoveries/science_bridge_directions.json \
            ai_lab/discoveries/science_bridge_ledger.json \
            ai_lab/reports/easy/science_bridge_experiment_latest.json \
            ai_lab/discoveries/science_bridge_experiment_ledger.json \
            ai_lab/reports/easy/free_hypothesis_latest.json \
            ai_lab/reports/easy/free_hypothesis_latest.md \
            ai_lab/discoveries/free_hypothesis_lab.json
          if git diff --cached --quiet; then
            echo "No Science Bridge evidence/context changed."
            exit 0
          fi
          git commit -m "record separated Science Bridge evidence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Science Bridge evidence pushed on attempt $attempt."
              exit 0
            fi
            git fetch --depth=50 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Science Bridge conflicts with newer research; refusing to overwrite it."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          exit 1
