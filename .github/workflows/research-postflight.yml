name: Research Postflight Integrity

on:
  workflow_run:
    workflows: ["Genesis Dream Loop"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: aeterna-research-postflight
  cancel-in-progress: false

jobs:
  postflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # The :47 watchdog can finish the Genesis Dream Loop successfully without executing a new
      # research burst. That is a deliberate no-op, not a new provenance context. Query the upstream
      # job steps and classify it narrowly: watchdog success + explicit Backup-not-needed success +
      # core research skipped. Missing/renamed/ambiguous steps fail closed in upstream_run_gate.py.
      - name: Detect explicit no-op upstream Dream run
        id: upstream
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python -m ai_lab.dream.upstream_run_gate

      - name: Record intentional no-op
        if: steps.upstream.outputs.noop == 'true'
        run: |
          echo "Genesis Dream Loop ${{ github.event.workflow_run.id }} was an explicit watchdog no-op."
          echo "No new burst exists, so runtime-context/manifest postflight is intentionally skipped."

      - name: Install research audit dependencies
        if: steps.upstream.outputs.noop != 'true'
        run: pip install -r requirements.txt

      - name: Audit final research infrastructure state
        id: health
        if: steps.upstream.outputs.noop != 'true'
        shell: bash
        run: |
          python -m ai_lab.dream.research_health
          HEALTHY="$(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('ai_lab/reports/easy/research_health_latest.json').read_text())
          print('true' if report.get('healthy') else 'false')
          PY
          )"
          echo "healthy=$HEALTHY" >> "$GITHUB_OUTPUT"
          echo "Research infrastructure healthy=$HEALTHY"

      - name: Preserve durable research operations backlog
        if: steps.upstream.outputs.noop != 'true'
        run: python -m ai_lab.dream.research_backlog

      - name: Enforce instrument and production protocol contracts
        if: steps.upstream.outputs.noop != 'true'
        shell: bash
        run: python -m ai_lab.dream.research_contract_audit > ai_lab/reports/easy/research_contract_latest.json

      - name: Enforce same-burst runtime context coherence
        if: steps.upstream.outputs.noop != 'true'
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python -m ai_lab.dream.runtime_context_audit \
            --expected-run-id "$EXPECTED_RUN_ID" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            > ai_lab/reports/easy/runtime_context_latest.json

      - name: Create or verify immutable burst manifest
        if: steps.upstream.outputs.noop != 'true'
        shell: bash
        env:
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          BURST="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('ai_lab/reports/easy/latest.json').read_text())['burst_id'])
          PY
          )"
          ARCHIVE="ai_lab/reports/easy/manifests/${BURST}.json"
          if [[ -f "$ARCHIVE" ]]; then
            echo "Existing manifest for $BURST; verifying file hashes."
            python -m ai_lab.dream.research_manifest --verify-existing
            cp "$ARCHIVE" ai_lab/reports/easy/research_manifest_latest.json
          else
            if [[ -z "$UPSTREAM_HEAD_SHA" ]]; then
              UPSTREAM_HEAD_SHA="$(git rev-parse HEAD)"
            fi
            AETERNA_RESEARCH_HEAD_SHA="$UPSTREAM_HEAD_SHA" \
            AETERNA_RESEARCH_RUN_ID="$UPSTREAM_RUN_ID" \
            AETERNA_RESEARCH_RUN_NUMBER="$UPSTREAM_RUN_NUMBER" \
            AETERNA_RESEARCH_RUN_ATTEMPT="$UPSTREAM_RUN_ATTEMPT" \
            AETERNA_RESEARCH_REF="$UPSTREAM_HEAD_BRANCH" \
              python -m ai_lab.dream.research_manifest --require-environment --require-protocol
            python -m ai_lab.dream.research_manifest --verify-existing
          fi

      - name: Update manifest-backed research burst index
        if: steps.upstream.outputs.noop != 'true'
        run: python -m ai_lab.dream.research_index

      - name: Upload postflight diagnostics
        if: ${{ always() && steps.upstream.outputs.noop != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: research-postflight-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ai_lab/reports/easy/research_health_latest.json
            ai_lab/reports/easy/research_health_latest.md
            ai_lab/reports/easy/research_contract_latest.json
            ai_lab/reports/easy/runtime_context_latest.json
            ai_lab/discoveries/research_backlog.json
            ai_lab/reports/easy/research_backlog_latest.md
            ai_lab/reports/easy/research_manifest_latest.json
            ai_lab/reports/easy/manifests/*.json
            ai_lab/discoveries/research_index.json
            ai_lab/reports/easy/research_history_latest.md

      - name: Persist healthy postflight records
        if: steps.upstream.outputs.noop != 'true' && steps.health.outputs.healthy == 'true'
        shell: bash
        run: |
          git config user.name "aeterna-research-integrity-bot"
          git config user.email "aeterna-research-integrity-bot@users.noreply.github.com"
          git add \
            ai_lab/reports/easy/research_health_latest.json \
            ai_lab/reports/easy/research_health_latest.md \
            ai_lab/reports/easy/research_contract_latest.json \
            ai_lab/reports/easy/runtime_context_latest.json \
            ai_lab/discoveries/research_backlog.json \
            ai_lab/reports/easy/research_backlog_latest.md \
            ai_lab/reports/easy/research_manifest_latest.json \
            ai_lab/reports/easy/manifests \
            ai_lab/discoveries/research_index.json \
            ai_lab/reports/easy/research_history_latest.md || true
          if git diff --cached --quiet; then
            echo "Postflight records already current."
            exit 0
          fi
          git commit -m "record research postflight integrity"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Postflight records pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git fetch --depth=30 origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Postflight integrity record conflicts with a newer main commit; not overwriting it."
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Could not push postflight records after 3 attempts."
          exit 1

      - name: Fail closed on infrastructure integrity errors
        if: steps.upstream.outputs.noop != 'true' && steps.health.outputs.healthy != 'true'
        run: |
          echo "::error::Research infrastructure health audit found strict integrity errors."
          cat ai_lab/reports/easy/research_health_latest.md || true
          exit 1
