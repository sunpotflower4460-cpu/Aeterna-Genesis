name: Dream Loop CI

on:
  pull_request:
    paths:
      - 'ai_lab/dream/**'
      - 'genesis/diagnostics/geometry_events.py'
      - 'tests/test_dream_loop.py'
      - 'tests/test_adaptive_dream.py'
      - 'tests/test_hourly_discovery.py'
      - 'tests/test_strict_geometry.py'
      - 'tests/test_promising_followups.py'
      - 'tests/test_dream_watchdog.py'
      - 'tools/collect_app_data.py'
      - 'app/src/components/DreamNightReport.tsx'
      - 'app/src/components/Inbox.tsx'
      - 'app/src/lib/dream.ts'
      - '.github/workflows/dream-loop*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dream Loop unit tests
        run: pytest -q tests/test_dream_loop.py tests/test_adaptive_dream.py tests/test_hourly_discovery.py tests/test_strict_geometry.py tests/test_promising_followups.py tests/test_dream_watchdog.py tests/test_ai_lab.py tests/test_ai_ledger.py
      - name: Tiny legacy Dream dry-run
        run: |
          python -m ai_lab.dream \
            --quick --mode random --trials 4 --repro-top 1 --repro-seeds 3 \
            --native-variants 1 --max-jobs 4 \
            --no-record --no-refresh-app --seed 42
      - name: Tiny strict Adaptive Dream v4 dry-run with promising-lead follow-up
        run: |
          python -m ai_lab.dream.strict_followup_loop \
            --quick --trials 4 --native3d-trials 2 --workers 1 \
            --repro-top 1 --repro-seeds 3 --compare-native3d-top 1 \
            --geometry-top 1 --geometry-broad 0 \
            --followup-trials-2d 4 --followup-trials-3d 1 --followup-max-leads 1 \
            --native-variants 1 --max-jobs 4 \
            --no-record --no-refresh-app --seed 43
      - name: Easy report and lead memory were produced
        run: |
          test -f ai_lab/reports/easy/latest.json
          test -f ai_lab/reports/easy/latest.md
          test -f ai_lab/discoveries/promising_leads.json
          grep -q 'promising_followup' ai_lab/reports/easy/latest.json

  observatory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
