name: Patch Cross-World dry-run persistence

on:
  push:
    branches:
      - fix/dream-measurement-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dream-measurement-integrity
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/_patch_cross_dryrun.py
      - run: |
          git config user.name aeterna-maintenance-bot
          git config user.email actions@users.noreply.github.com
          git add ai_lab/dream/cross_world_emergence.py
          git diff --cached --check
          git commit -m "fix Cross-World dry-run persistence"
          git push origin HEAD:fix/dream-measurement-integrity
