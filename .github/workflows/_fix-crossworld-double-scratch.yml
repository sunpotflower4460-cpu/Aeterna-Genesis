name: Fix Cross-World double scratch

on:
  push:
    branches:
      - fix/dream-measurement-integrity
    paths:
      - 'tools/_fix_crossworld_double_scratch.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dream-measurement-integrity
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/_fix_crossworld_double_scratch.py
      - run: |
          git config user.name aeterna-maintenance-bot
          git config user.email actions@users.noreply.github.com
          git add ai_lab/dream/cross_world_emergence.py
          git diff --cached --check
          git commit -m "fix Cross-World double scratch path"
          git push origin HEAD:fix/dream-measurement-integrity
