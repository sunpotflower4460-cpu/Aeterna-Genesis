name: Research Infrastructure CI

on:
  pull_request:
    paths:
      - 'ai_lab/dream/progress_context.py'
      - 'ai_lab/dream/environment_fingerprint.py'
      - 'ai_lab/dream/protocol_fingerprint.py'
      - 'ai_lab/dream/runtime_context_audit.py'
      - 'ai_lab/dream/research_health.py'
      - 'ai_lab/dream/research_manifest.py'
      - 'ai_lab/dream/research_backlog.py'
      - 'ai_lab/dream/research_index.py'
      - 'ai_lab/dream/research_finalize.py'
      - 'ai_lab/dream/strict_goal_loop.py'
      - 'tests/test_progress_context.py'
      - 'tests/test_environment_fingerprint.py'
      - 'tests/test_protocol_fingerprint.py'
      - 'tests/test_runtime_context_audit.py'
      - 'tests/test_research_health.py'
      - 'tests/test_research_manifest.py'
      - 'tests/test_research_backlog.py'
      - 'tests/test_research_index.py'
      - 'tests/test_research_finalize.py'
      - 'docs/RESEARCH_INFRASTRUCTURE.md'
      - '.github/workflows/research-infra-ci.yml'
      - '.github/workflows/research-postflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Context identity, reproducibility and infrastructure unit tests
        run: |
          pytest -q \
            tests/test_progress_context.py \
            tests/test_environment_fingerprint.py \
            tests/test_protocol_fingerprint.py \
            tests/test_runtime_context_audit.py \
            tests/test_research_health.py \
            tests/test_research_manifest.py \
            tests/test_research_backlog.py \
            tests/test_research_index.py \
            tests/test_research_finalize.py

      - name: Current tracked evidence must pass strict infrastructure health
        run: python -m ai_lab.dream.research_health --strict --no-record

      - name: Operations backlog must build read-only
        run: python -m ai_lab.dream.research_backlog --no-record

      - name: Execution environment fingerprint must build read-only
        run: python -m ai_lab.dream.environment_fingerprint --no-record

      # Runtime-context audit is exercised by isolated fixtures above. The tracked main aliases are checked
      # in production postflight after protocol_latest has been generated for the same burst.
      - name: Provenance manifest must build read-only
        run: python -m ai_lab.dream.research_manifest --no-record

      - name: Infrastructure checks must not mutate tracked evidence
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Research infrastructure CI mutated the working tree."
            exit 1
          fi
