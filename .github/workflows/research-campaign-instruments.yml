name: Research campaign instruments
on:
  pull_request:
    paths:
      - 'research/campaigns/20261108-*/**'
      - 'research/campaigns/20261120-water-diffusion-reference/**'
      - 'research/campaigns/20261120-vortex-*/**'
      - 'tools/study_record.py'
      - '.github/workflows/research-campaign-instruments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scalar-field reference equivalence, 3D first
        run: python research/campaigns/20261108-conserved-mixtures/run.py validate --out "$RUNNER_TEMP/field-validation"
      - name: Determinism, symmetry and output protection
        run: python -m pytest research/campaigns/20261108-conserved-mixtures/test_instruments.py -q
      - name: Transport and reversible-reaction instruments
        run: python -m pytest research/campaigns/20261108-reactive-mixture/test_thermodynamics.py -q
      - name: Bounded material model and independent local limit
        run: python -m pytest research/campaigns/20261108-reactive-mixture-v02/test_bounded_model.py -q
      - name: Local exclusion-fluid detailed balance and exact canonical controls
        run: python -m pytest research/campaigns/20261108-local-reactive-lattice/test_instruments.py -q
      - name: State mobilities and independent exact-event scheduler
        run: python -m pytest research/campaigns/20261108-local-reactive-lattice-v02/test_instruments.py -q
      - name: Explicit fuel transport, reservoir exchange and grand-canonical controls
        run: python -m pytest research/campaigns/20261108-local-reactive-fuel/test_instruments.py -q
      - name: Independent sparse proposal realization and absolute reaction clock
        run: python -m pytest research/campaigns/20261108-local-reactive-fuel/test_sparse.py -q

  water-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4
      - name: Verify the registered inputs and replay every archived coordinate
        env:
          STUDY: research/campaigns/20261120-water-diffusion-reference
        run: |
          registered=$(python -c 'import json, os; print(json.load(open(os.environ["STUDY"] + "/evidence/record.json"))["registration_commit"])')
          git fetch --no-tags --depth=1 origin "$registered"
          python -m tools.study_record "$STUDY/PLAN.json" "$STUDY/evidence/record.json"
          python "$STUDY/run.py" --registered-at "$registered" --out "$RUNNER_TEMP/tracers"
          python "$STUDY/analyze.py" --evidence "$RUNNER_TEMP/tracers" --out "$RUNNER_TEMP/measurements"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          study = Path(os.environ["STUDY"])
          for case in json.loads((study / "PLAN.json").read_text())["cases"]:
              name = f"{case}.npz"
              with np.load(study / "evidence" / name) as archived, np.load(Path(os.environ["RUNNER_TEMP"]) / "tracers" / name) as replay:
                  np.testing.assert_array_equal(archived["displacement_steps"], replay["displacement_steps"])
          PY

  vortex-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      LATE: research/campaigns/20261120-vortex-drive-stop
      EARLY: research/campaigns/20261120-vortex-early-stop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 scipy==1.15.3
      - name: Verify registered plans and re-read the published states and interventions
        run: |
          for record in "$LATE/evidence/record.json" "$EARLY/evidence-first-attempt/record.json" "$EARLY/evidence/record.json"; do
            registered=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["registration_commit"])' "$record")
            git fetch --no-tags --depth=1 origin "$registered"
          done
          python -m tools.study_record "$EARLY/PLAN.json" "$EARLY/evidence-first-attempt/record.json"
          python "$LATE/analyze.py" --evidence "$LATE/evidence" --out "$RUNNER_TEMP/late-measurements"
          python "$EARLY/paired_analysis.py" --evidence "$EARLY/evidence" --out "$RUNNER_TEMP/early-measurements"
          python "$LATE/crosscheck.py" --evidence "$LATE/evidence"
