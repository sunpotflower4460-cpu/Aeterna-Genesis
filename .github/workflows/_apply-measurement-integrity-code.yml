name: Apply measurement integrity code patch

on:
  push:
    branches:
      - fix/dream-measurement-integrity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dream-measurement-integrity
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply code patch
        run: python tools/_apply_measurement_integrity_code.py
      - name: Commit code changes only
        run: |
          git config user.name aeterna-maintenance-bot
          git config user.email actions@users.noreply.github.com
          git add ai_lab genesis tests
          git diff --cached --check
          git commit -m "fix Dream measurement integrity and dry-run isolation"
          git push origin HEAD:fix/dream-measurement-integrity
