name: Pure Genesis R0 CI

on:
  pull_request:
    paths:
      - 'ai_lab/dream/why_gate.py'
      - 'ai_lab/dream/pure_genesis.py'
      - 'ai_lab/dream/adaptive_v8.py'
      - 'ai_lab/dream/strict_goal_loop.py'
      - 'ai_lab/dream/portfolio_director.py'
      - 'ai_lab/missions/pure_genesis_r0.json'
      - 'docs/GENESIS_ROOT.md'
      - 'tests/test_pure_genesis.py'
      - '.github/workflows/pure-genesis-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pure Genesis and portfolio tests
        run: pytest -q tests/test_pure_genesis.py tests/test_hypothesis_evolution.py
      - name: Tiny R0 law search
        run: |
          python - <<'PY'
          from ai_lab.dream import pure_genesis
          r = pure_genesis.run_root_research(
              burst_id='ci-r0', law_trials=6, sizes=(6, 8), steps=20, seed=11, persist=False,
          )
          assert r['law_trials'] == 6
          assert r['why_gate']['accepted'] == 6
          assert r['why_gate']['physical_givens_beyond_R0'] == []
          assert r['brain_from_zero']['brain_claim'] is False
          print('Pure Genesis R0 CI:', r['top_laws'][0]['id'], r['top_laws'][0]['priority'])
          PY
