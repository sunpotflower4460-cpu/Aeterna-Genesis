# 水槽ラボの AI の会議の設定。これを lab/config.toml にコピーして書き換える（lab/ は git 管理外）。
# API キーはここに書かない。環境変数の名前だけを書く（例: export ANTHROPIC_API_KEY=...）。
# キーが無い役は自動で飛ばす。中心の役が使えないときは Claude Code の橋渡し（/guide）になる。
#
# model の ID と単価は各社の最新の資料で確かめてから書くこと（ここに書いた既定値は Opus 5.5 だけ）。
# 単価は USD / 100 万トークン。画面の費用表示と 1 日の上限に使う（0 なら費用を数えない）。

[core]                       # 中心：うえきさんと話し、測定と照らし合わせ、提案カードを出す
provider = "anthropic"       # anthropic | deepseek | gemini | openai_compat
model = "claude-opus-5-5"
effort = "medium"            # low | medium | high | xhigh | max（Opus 5.5 の既定は medium）
api_key_env = "ANTHROPIC_API_KEY"
price_in = 4.0
price_out = 20.0

[second_view]                # 別の視点：事件簿を読み、別の説明（作り物・置いたものの効果）を出す
provider = "deepseek"        # DeepSeek の API に直接つなぐ（標準ライブラリだけ。OpenAI のライブラリは使わない）
base_url = "https://api.deepseek.com"
model = ""                   # 例: DeepSeek V4.1 Flash の model ID（DeepSeek の資料で確認）
api_key_env = "DEEPSEEK_API_KEY"
images = false               # 画像を読めない model なら false（事件簿の文章だけで「見る」）
price_in = 0.0
price_out = 0.0

[vision]                     # 見る係：画像と動きから「見た目（未測定）」を書く
provider = "gemini"          # gemini（動画も読める）| openai_compat（画像）
model = ""                   # 例: Gemini の model ID（Google の資料で確認）
api_key_env = "GEMINI_API_KEY"
video = true                 # mp4 を渡す（ffmpeg が無ければ連番の画像）
price_in = 0.0
price_out = 0.0

# GPT を見る係にする例（上の [vision] と入れ替える）
# [vision]
# provider = "openai_compat"
# base_url = "https://api.openai.com/v1"
# model = ""
# api_key_env = "OPENAI_API_KEY"
# images = true

# 画面で選べる AI の一覧（役ごと・研究員ごとに選ぶ）。上の 3 つの役の設定も自動で一覧に入る。
# key は画面に出る名前。tools を使えるのは anthropic / deepseek / openai_compat（研究員になれる）。
# [[models]]
# key = "Opus 5.5"
# provider = "anthropic"
# model = "claude-opus-5-5"
# effort = "medium"
# api_key_env = "ANTHROPIC_API_KEY"
# price_in = 4.0
# price_out = 20.0
#
# [[models]]
# key = "DeepSeek V4.1 Flash"
# provider = "deepseek"
# base_url = "https://api.deepseek.com"
# model = ""                 # DeepSeek の資料で確認
# api_key_env = "DEEPSEEK_API_KEY"

[limits]
max_usd_per_day = 3.0        # これを超えると、その日は AI を呼ばない
